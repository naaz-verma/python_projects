<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="#hero" class="nav-logo" id="nav-name">Portfolio</a>
            <div class="nav-links">
                <a href="#about">About</a>
                <a href="#skills">Skills</a>
                <a href="#projects">Projects</a>
                <a href="#contact">Contact</a>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero" id="hero">
        <div class="hero-content">
            <img src="assets/photo.jpg" alt="Profile Photo" class="hero-photo" id="hero-photo">
            <h1 id="hero-name">Your Name</h1>
            <p class="hero-tagline" id="hero-tagline">Aspiring Developer</p>
            <div class="hero-buttons">
                <a href="#projects" class="btn btn-primary">View Projects</a>
                <a href="#contact" class="btn btn-outline">Contact Me</a>
            </div>
        </div>
    </section>

    <!-- About Section -->
    <section class="section" id="about">
        <div class="container">
            <h2 class="section-title">About Me</h2>
            <p class="about-text" id="about-text">Loading...</p>
            <div class="education" id="education-container"></div>
        </div>
    </section>

    <!-- Skills Section -->
    <section class="section section-alt" id="skills">
        <div class="container">
            <h2 class="section-title">Skills</h2>
            <div class="skills-grid" id="skills-grid"></div>
        </div>
    </section>

    <!-- Projects Section -->
    <section class="section" id="projects">
        <div class="container">
            <h2 class="section-title">Projects</h2>
            <div class="projects-grid" id="projects-grid"></div>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="section section-alt" id="contact">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-links" id="contact-links"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>Built with learning at <strong>WorldWithWeb</strong></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
